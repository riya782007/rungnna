name: Apps (Windows + Android)

# Builds the Rungnna Shop OS apps from this repository and publishes them as a GitHub release:
#   Windows: installer (.exe) and portable .zip     Android: installable .apk
# Run it: push a tag like apps-v1.0.0, or Actions → "Apps (Windows + Android)" → Run workflow.
on:
  push:
    tags: ["apps-v*", "desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.1)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#*-v}"; else V="${{ github.event.inputs.version }}"; fi
          IFS=. read -r A B C <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${A:-1} * 10000 + ${B:-0} * 100 + ${C:-0} ))" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run --reporter=dot

  windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build the web app (same build as the website)
        run: |
          npm ci
          npm run build
      - name: Pack the Windows app
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          rm -rf web && cp -r ../dist web
          npm install --no-audit --no-fund
          npm pkg set version=${{ needs.version.outputs.v }}
          node make-icon.cjs
          npx electron-builder --win zip nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/*.zip
            desktop/release/*.exe

  android:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the web app (same build as the website)
        run: |
          npm ci
          npm run build
      - name: Android project
        working-directory: mobile
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
          APP_VERSION_CODE: ${{ needs.version.outputs.code }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          rm -rf web android && cp -r ../dist web
          npm install --no-audit --no-fund
          npx cap add android
          # private key from repository secrets when set; otherwise the committed test key
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$PWD/release.jks"; echo "KEYSTORE_FILE=$PWD/release.jks" >> "$GITHUB_ENV";
          else echo "KEYSTORE_FILE=$PWD/rungnna-test.jks" >> "$GITHUB_ENV"; fi
      - name: Permissions, version, signing
        working-directory: mobile
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
          APP_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          node scripts/prepare-android.cjs
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'rungnna-test' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'rungnna' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'rungnna-test' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../release && cp app/build/outputs/apk/release/app-release.apk "../release/Rungnna-Shop-OS-${{ needs.version.outputs.v }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/release/*.apk

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.version.outputs.v }}
          name: Rungnna Shop OS ${{ needs.version.outputs.v }} (Windows + Android)
          make_latest: true
          body: |
            **Rungnna Shop OS apps**: billing, stock, labels and every other screen, working with or without internet.

            **Windows (counter PC)** — download one:
            - `Rungnna-Shop-OS-Setup-${{ needs.version.outputs.v }}.exe`: installer (recommended), adds desktop and Start-menu icons.
            - `Rungnna-Shop-OS-${{ needs.version.outputs.v }}-x64.zip`: no install; unzip and open `Rungnna Shop OS.exe`.
            Windows may show "Windows protected your PC" the first time (not code-signed yet): **More info → Run anyway**.

            **Android phone**
            - `Rungnna-Shop-OS-${{ needs.version.outputs.v }}.apk`: open it on the phone and allow "Install unknown apps" for your browser / Files app.

            Bluetooth stickers: Labels → Printer settings → Print labels using **TSC / TSPL** → **Connect Bluetooth printer**.
          files: out/*
