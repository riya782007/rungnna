name: Checks

# Every pull request and push to main: the unit tests and the same build Vercel runs, so a break shows on
# GitHub with its full log before it reaches the shop (Vercel only says "Deployment has failed").
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Type-check and build (same as Vercel)
        run: npm run build
      - name: Tests
        run: npx vitest run --reporter=dot
